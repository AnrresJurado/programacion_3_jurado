<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Alta de Operadores</title>
</head>
<body>
    <h1>Formulario de Alta de Operadores</h1>

    <form action="/registrar-metodo" method="post">
        <label for="nombre">Nombre Completo:</label>
        <input type="text" id="nombre" name="nombre" placeholder="ej. Andres Jurado">

        <label for="correo">Correo Corporativo:</label>
        <input type="email" id="correo" name="correo" placeholder="ej. ajurado@transporte.com"><br>

        <label for="password">Clave de Acceso:</label>
        <input type="password" id="password" name="password">

        <label for="perfil_url">Perfil Profesional:</label>
        <input type="url" id="perfil_url" name="perfil_url" placeholder="ej. https://music.youtube.com/watch?v=tlyhaKzdsxY&list=RDAMVMNtNkhZMuzTI"><br>

        <label for="telefono">Teléfono de Emergencia:</label>
        <input type="tel" id="telefono" name="telefono" placeholder="ej. 0998899765">

        <label for="unidades">Buscar Unidad:</label>
        <input type="search" id="unidades" name="unidades">

        <label for="experiencia">Años de Experiencia:</label>
        <input type="number" id="experiencia" name="experiencia" min="0" max="50" value="1"><br>

        <label for="combustible">Nivel de Combustible: </label>
        <input type="range" id="combustible" name="combustible" min="0" max="100" value="50"><br>

        <button type="submit">Registrar Operador en el Sistema"</button>
    </form>
</body>
</html>
