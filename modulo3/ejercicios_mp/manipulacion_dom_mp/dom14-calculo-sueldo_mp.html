<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <script src="dom14-calculo-sueldo_mp.js" defer></script>
   <title>TMS - Liquidación de Flete</title>
   <style>
       body { font-family: Arial, sans-serif; margin: 40px; background-color: #f5f7fa; }
       .card { background: white; border: 1px solid #dde3ea; border-radius: 8px; padding: 24px; max-width: 480px; }
       .error { color: #c0392b; display: none; margin-top: 10px; font-weight: bold; }
       .resultado { display: none; margin-top: 20px; border-top: 2px solid #2c3e50; padding-top: 15px; }
       .fila-rol { display: flex; justify-content: space-between; margin: 6px 0; }
       .monto-verde { color: #1e8449; }
       .monto-rojo { color: #c0392b; }
   </style>
</head>
<body>
   <div class="card">
       <h2>Liquidación de Ruta por Conductor</h2>
       
       <label>Valor Flete Base ($):</label><br>
       <input id="inFleteBase" type="number" step="0.01"><br><br>

       <label>Bono por Destino Crítico / Viáticos ($):</label><br>
       <input id="inBonoRuta" type="number" step="0.01"><br><br>

       <label>Retención de Seguro de Carga (%):</label><br>
       <input id="inSeguro" type="number" value="4.5" step="0.01"><br><br>

       <label>Descuento por Penalización / Retraso ($):</label><br>
       <input id="inPenalizacion" type="number" step="0.01"><br><br>

       <button onclick="calcularLiquidacion()">Calcular Liquidación</button>
       <button onclick="limpiar()">Limpiar</button>

       <div class="error" id="error"></div>

       <div class="resultado" id="resultado">
           <h3>Resumen de Pagos</h3>
           <div class="fila-rol">
               <span>Flete Base</span>
               <span class="monto-verde" id="rFlete"></span>
           </div>
           <div class="fila-rol">
               <span>Bono Viáticos</span>
               <span class="monto-verde" id="rBono"></span>
           </div>
           <div class="fila-rol">
               <span><strong>Total Ingresos</strong></span>
               <span class="monto-verde" id="rIngresos"></span>
           </div>
           <div class="fila-rol">
               <span>Seguro Flota (<span id="rPorcentajeSeguro"></span>%)</span>
               <span class="monto-rojo" id="rDeduccionSeguro"></span>
           </div>
           <div class="fila-rol">
               <span>Descuento Penalización</span>
               <span class="monto-rojo" id="rMontoPenalizacion"></span>
           </div>
           <div class="fila-rol">
               <span><strong>Total Deducciones</strong></span>
               <span class="monto-rojo" id="rDeducciones"></span>
           </div>
           <hr>
           <div class="fila-rol" style="font-size: 1.2em; font-weight: bold;">
               <span>NETO A PAGAR</span>
               <span id="rNeto"></span>
           </div>
       </div>
   </div>
</body>
</html>
