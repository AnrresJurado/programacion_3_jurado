<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMS - Sensores de Muelle</title>
    <script src="dom05-mouse-touch_mp.js" defer></script>
</head>
<body>
    <h1>Panel de Almacén e Infraestructura</h1>
    <h2>Control de Muelles de Carga (Mouse y Touch)</h2>

    <p>Pasa el mouse sobre el Muelle A para simular llegada de camión:</p>
    <div id="muelleA" style="width: 220px; height: 150px; background-color: lightcyan; border: 2px dashed black; text-align:center; padding-top:20px;">
        <strong>MUELLE A (Escritorio)</strong>
    </div>

    <br>
    <p>Toca la zona táctil para simular la llegada en una Tablet industrial:</p>
    <div id="muelleTouch" style="width: 220px; height: 150px; background-color: lightcoral; border: 2px solid red; text-align:center; padding-top:20px; color: white;">
        <strong>MUELLE B (Táctil)</strong>
    </div>
</body>
</html>
