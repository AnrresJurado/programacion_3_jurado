<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMS - Desplazamiento Logístico</title>
    <script src="dom06-mouse-touch_mp.js" defer></script>
</head>
<body>
    <h1>Monitoreo Visual del Patio de Maniobras</h1>
    <h2>Arrastra el Camión (Indicador de posición)</h2>
    
    <div id="container-patio" style="position:relative; width:100%; height:400px; background:#e9ecef; margin-top:20px; border: 2px solid #ccc;">
        <div id="camion-icono"
            style="width:70px; height:70px; background:darkblue; border-radius:10px; position:absolute; top:100px; left:100px; color:white; text-align:center; font-family:sans-serif; font-size:11px; line-height:1.2; padding-top:15px; cursor:move; user-select:none;">
            Camión<br>🚚
        </div>
    </div>

    <div style="margin-top:20px;">
        <button id="botonDespacho" style="padding:12px 24px; font-size:18px; transition: all 0.3s; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">
            🚀 ¡AUTORIZAR SALIDA DE FLOTA!
        </button>
    </div>

    <div id="contenedorPeligro" style="position:relative; width:100%; height:200px; margin-top:20px; background:#f8d7da;">
        <div id="triangulo-advertencia" style="
            width: 0;
            height: 0;
            border-left: 40px solid transparent;
            border-right: 40px solid transparent;
            border-bottom: 80px solid #721c24;
            position: absolute;
            top: 50px;
            left: calc(50% - 40px);
            transition: transform 0.2s ease;
            cursor: pointer;">
        </div>
        <p style="text-align: center; padding-top: 140px; color: #721c24; font-weight: bold;">Zona de Obras (Pasa el mouse para rotar aviso)</p>
    </div>
</body>
</html>
