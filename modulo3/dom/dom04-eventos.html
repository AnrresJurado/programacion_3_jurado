<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulacion de DOM</title>
    <script src="dom04-eventos.js" defer></script> 
    <style>
        .boton {
            background-color: red;
            padding: 0%.5em 1em;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1 id="titulo">Eventos del DOM</h1>
    <h2 onclick="alert('Hello DOM')">Eventos In line</h2>
    <button class="boton" id="btn" 
    onclick="mostrarAlerta()">
    Eventos con addEvenlistener </button>

    <button class="boton" id="btn2" 
    onclick="agregarProducto()"
    >Agregar Producto</button>

    <ul id="lista-productos1"></ul>
    <button class="boton" id="btn3">
        agregar Productos desde listener
    </button>
    <ul id="lista-productos2"></ul>
    <h2 id="mensaje">
        Texto Original
    </h2>
    <button class="cambiar" id="btn4">Reeemplazar texto</button>
</body>
</html>
